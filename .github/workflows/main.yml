---
# Sample Dummy YAML Configuration File
app_name: "TestApplication"
version: "1.0.0"
environment: "development"
debug: true

server:
  host: "0.0.0.0"
  port: 8080
  workers: 4

database:
  driver: "postgresql"
  host: "localhost"
  port: 5432
  user: "admin"
  password: "secret_password"
  options:
    ssl_mode: "disable"
    pool_size: 10

features:
  - name: "auth_v2"
    enabled: true
  - name: "dark_mode"
    enabled: false
  - name: "beta_dashboard"
    enabled: true

users:
  - id: 101
    name: "Alice Smith"
    roles: ["admin", "user"]
  - id: 102
    name: "Bob Jones"
    roles: ["user"]
